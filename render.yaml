services:
  - type: web
    name: mise-en-place-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pnpm install --frozen-lockfile
    startCommand: pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES
        value: 7d
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX
        value: "100"
      - key: BODY_LIMIT
        value: 5mb
      - key: ALLOWED_ORIGIN
        sync: false
