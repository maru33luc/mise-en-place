<div class="recipe-card">
  <!-- Imagen con overlay -->
  <div class="card-image">
    <img
      [src]="'https://images.unsplash.com/photo-' + getFoodImage(recipe().id) + '?w=600&q=80&auto=format&fit=crop'"
      [alt]="recipe().title"
      loading="lazy"
    />
    <div class="card-image-overlay"></div>
    <div class="card-badge" [class]="DIFFICULTY_CONFIG[recipe().difficulty].badge">
      {{ DIFFICULTY_CONFIG[recipe().difficulty].label }}
    </div>
  </div>

  <!-- Contenido -->
  <div class="card-body">
    <h3 class="card-title">{{ recipe().title }}</h3>
    <p class="card-description">{{ recipe().description }}</p>

    <div class="card-ingredients">
      <h4>Ingredientes</h4>
      <ul class="ingredients-list">
        @for (ing of recipe().ingredients; track $index) {
          <li>
            <span class="ingredient-name">{{ ing.name }}</span>
            <span class="ingredient-amount">{{ ing.amount }} {{ ing.unit }}</span>
          </li>
        }
      </ul>
    </div>
  </div>

  <!-- Acciones -->
  <div class="card-actions">
    <button type="button" class="action-btn edit-btn" (click)="edit.emit(recipe())">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </svg>
      Editar
    </button>
    <button type="button" class="action-btn delete-btn" (click)="delete.emit(recipe())">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <polyline points="3 6 5 6 21 6"/>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
      </svg>
      Eliminar
    </button>
  </div>
</div>
