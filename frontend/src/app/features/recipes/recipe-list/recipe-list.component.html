<section class="recipes-section">
  <div class="section-header">
    <div class="header-left">
      <span class="section-label">Collection</span>
      <h2 class="section-title">My Recipes</h2>
    </div>
    <div class="recipe-count">
      <span class="count-number">{{ recipes().length }}</span>
      <span class="count-label">{{ recipes().length === 1 ? 'recipe' : 'recipes' }}</span>
    </div>
  </div>

  @if (loading() && recipes().length === 0) {
    <app-loading />
  } @else if (recipes().length > 0) {
    <div class="recipes-grid">
      @for (recipe of recipes(); track recipe.id) {
        <app-recipe-card
          [recipe]="recipe"
          (edit)="edit.emit($event)"
          (delete)="delete.emit($event)"
        />
      }
    </div>
  } @else if (!loading()) {
    <app-empty-state
      title="No recipes yet"
      message="Create your first recipe with the + button above"
    />
  }
</section>
